services:
  grok2api:
    build: .
    ports:
      - "${HOST_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8000}
    restart: unless-stopped

  warp:
    image: caomingjun/warp
    profiles: ["warp"]
    restart: unless-stopped

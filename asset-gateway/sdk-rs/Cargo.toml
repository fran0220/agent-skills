[package]
name = "origin-asset"
version = "0.2.1"
edition = "2021"
description = "Rust SDK for the Origin Asset Gateway service"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fran0220/agent-skills"
homepage = "https://github.com/fran0220/agent-skills/tree/main/asset-gateway/sdk-rs"
documentation = "https://docs.rs/origin-asset"
readme = "README.md"
keywords = ["ai", "asset-generation", "asset-gateway", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

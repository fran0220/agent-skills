server {
    listen 443 ssl;
    server_name asset.origingame.dev;

    ssl_certificate /etc/letsencrypt/live/asset.origingame.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset.origingame.dev/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:6700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 50M;
        proxy_read_timeout 300;
    }
}

[package]
name = "origin-gamedb"
version = "0.1.1"
edition = "2021"
description = "Rust SDK for Origin GameDB — knowledge graph ingestion and semantic search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fran0220/agent-skills"
homepage = "https://github.com/fran0220/agent-skills/tree/main/cognee-admin/sdk"
documentation = "https://docs.rs/origin-gamedb"
readme = "README.md"
keywords = ["gamedb", "knowledge-graph", "semantic-search", "sdk", "origin"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

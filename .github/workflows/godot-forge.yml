# godot-forge CI — TypeScript lint & test
name: godot-forge

on:
  push:
    branches: [main]
    paths:
      - 'godot-forge/cli/**'
      - '.github/workflows/godot-forge.yml'
  pull_request:
    paths:
      - 'godot-forge/cli/**'
      - '.github/workflows/godot-forge.yml'

defaults:
  run:
    working-directory: godot-forge/cli

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: godot-forge/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

# asset-gateway CI — Rust build, test, cross-compile
name: asset-gateway

on:
  push:
    branches: [main]
    paths:
      - 'cli/asset-gateway/**'
      - '.github/workflows/asset-gateway.yml'
  pull_request:
    paths:
      - 'cli/asset-gateway/**'
      - '.github/workflows/asset-gateway.yml'

defaults:
  run:
    working-directory: cli/asset-gateway

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: asset_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASSET_GATEWAY_DATABASE_URL: postgres://test:test@localhost:5432/asset_gateway_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/asset-gateway/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/asset-gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy

      - name: Format check
        run: cargo fmt -- --check

  build-arm64:
    name: Build ARM64 (deploy artifact)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain + ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cli/asset-gateway/target/
          key: ${{ runner.os }}-cargo-arm64-${{ hashFiles('cli/asset-gateway/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-arm64-

      - name: Build release (ARM64)
        working-directory: cli/asset-gateway
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-gateway-aarch64
          path: cli/asset-gateway/target/aarch64-unknown-linux-gnu/release/asset-gateway
          retention-days: 7

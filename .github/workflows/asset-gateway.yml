# asset-gateway CI — build, test, deploy to jpdata
name: asset-gateway

on:
  push:
    branches: [main]
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'
  pull_request:
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'

defaults:
  run:
    working-directory: asset-gateway/cli

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            asset-gateway/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('asset-gateway/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --release

      - name: Test
        run: cargo test --lib

      - name: Clippy
        run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy

      - name: Format check
        run: cargo fmt -- --check

  deploy:
    name: Build & Deploy (jpdata)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            asset-gateway/cli/target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('asset-gateway/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86_64-

      - name: Build release (x86_64)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asset-gateway-x86_64
          path: asset-gateway/cli/target/release/asset-gateway
          retention-days: 7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.JPDATA_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.JPDATA_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.JPDATA_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SCP target/release/asset-gateway root@${{ secrets.JPDATA_HOST }}:/opt/asset-gateway/asset-gateway.new
          $SSH "mv /opt/asset-gateway/asset-gateway.new /opt/asset-gateway/asset-gateway && systemctl restart asset-gateway && sleep 2 && systemctl --no-pager --full status asset-gateway | head -10"

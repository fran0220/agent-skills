# asset-gateway CI — build, test, docker deploy to jpdata
name: asset-gateway

on:
  push:
    branches: [main]
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'
  pull_request:
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'

defaults:
  run:
    working-directory: asset-gateway/cli

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}/asset-gateway

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            asset-gateway/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('asset-gateway/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test --lib
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Docker Build & Deploy
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: asset-gateway/cli
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.JPDATA_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.JPDATA_HOST }}"
          $SSH "docker pull ${{ env.IMAGE }}:latest && \
            docker stop asset-gateway 2>/dev/null; docker rm asset-gateway 2>/dev/null; \
            docker run -d --name asset-gateway --restart unless-stopped \
              --network host \
              --env-file /opt/asset-gateway/.env \
              -v /opt/asset-gateway/config.toml:/etc/asset-gateway/config.toml:ro \
              -v /opt/asset-gateway/data:/opt/asset-gateway/data \
              ${{ env.IMAGE }}:latest \
              serve --host 0.0.0.0 --port 6700 --config /etc/asset-gateway/config.toml && \
            sleep 3 && docker logs asset-gateway --tail 5"

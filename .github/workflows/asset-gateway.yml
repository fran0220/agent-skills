# asset-gateway CI — check on runner, build & deploy on Oracle (aarch64)
name: asset-gateway

on:
  push:
    branches: [main]
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'
  pull_request:
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'

defaults:
  run:
    working-directory: asset-gateway/cli

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            asset-gateway/cli/target/
          key: ${{ runner.os }}-22.04-cargo-${{ hashFiles('asset-gateway/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-22.04-cargo-
      - run: cargo check --release
      - run: cargo test --lib
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Deploy (Oracle)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Setup SSH
        working-directory: /tmp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & deploy on server
        working-directory: /tmp
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new opc@${{ secrets.ORACLE_HOST }}"
          $SSH "cd /opt/asset-gateway/repo && \
            git fetch origin main && git reset --hard origin/main && \
            cd asset-gateway/cli && \
            source ~/.cargo/env && \
            SQLX_OFFLINE=true cargo build --release 2>&1 | tail -5 && \
            cp target/release/asset-gateway /opt/asset-gateway/asset-gateway && \
            chmod +x /opt/asset-gateway/asset-gateway && \
            sudo systemctl restart asset-gateway && \
            sleep 2 && sudo systemctl --no-pager --full status asset-gateway | head -8"

# asset-gateway CI — check + remote build on jpdata
name: asset-gateway

on:
  push:
    branches: [main]
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'
  pull_request:
    paths:
      - 'asset-gateway/cli/**'
      - '.github/workflows/asset-gateway.yml'

defaults:
  run:
    working-directory: asset-gateway/cli

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            asset-gateway/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('asset-gateway/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test --lib
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Deploy (jpdata)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Setup SSH
        working-directory: /tmp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.JPDATA_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & restart on server
        working-directory: /tmp
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.JPDATA_HOST }}"
          $SSH "cd /opt/asset-gateway/repo && \
            git fetch origin main && git reset --hard origin/main && \
            cd asset-gateway/cli && \
            source ~/.cargo/env && \
            cargo build --release 2>&1 | tail -5 && \
            cp target/release/asset-gateway /opt/asset-gateway/asset-gateway.new && \
            cp /opt/asset-gateway/asset-gateway /opt/asset-gateway/asset-gateway.old 2>/dev/null; \
            mv /opt/asset-gateway/asset-gateway.new /opt/asset-gateway/asset-gateway && \
            systemctl restart asset-gateway && \
            sleep 2 && systemctl --no-pager --full status asset-gateway | head -8"

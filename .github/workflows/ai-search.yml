name: ai-search

on:
  push:
    branches: [main]
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'
  pull_request:
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'

defaults:
  run:
    working-directory: ai-search/cli

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ai-search/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('ai-search/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check
        run: cargo check --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy

      - name: Format check
        run: cargo fmt -- --check

  deploy:
    name: Build & Deploy (BWG)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ai-search/cli/target/
          key: ${{ runner.os }}-cargo-x86_64-${{ hashFiles('ai-search/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-x86_64-

      - name: Build release (x86_64)
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-x86_64
          path: ai-search/cli/target/release/ai-search
          retention-days: 7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BWG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.BWG_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          $SCP target/release/ai-search root@${{ secrets.BWG_HOST }}:/opt/ai-search/ai-search.new
          $SSH "mv /opt/ai-search/ai-search.new /opt/ai-search/ai-search && systemctl restart ai-search && sleep 2 && systemctl --no-pager --full status ai-search | head -10"

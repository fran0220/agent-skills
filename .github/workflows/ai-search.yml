# ai-search CI — build, test, docker deploy to BWG
name: ai-search

on:
  push:
    branches: [main]
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'
  pull_request:
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'

defaults:
  run:
    working-directory: ai-search/cli

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}/ai-search

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ai-search/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('ai-search/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Docker Build & Deploy
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ai-search/cli
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BWG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.BWG_HOST }}"
          $SSH "docker pull ${{ env.IMAGE }}:latest && \
            docker stop ai-search 2>/dev/null; docker rm ai-search 2>/dev/null; \
            docker run -d --name ai-search --restart unless-stopped \
              --network host \
              -v /opt/ai-search/config.toml:/etc/ai-search/config.toml:ro \
              ${{ env.IMAGE }}:latest \
              serve --port 6900 --config /etc/ai-search/config.toml && \
            sleep 3 && docker logs ai-search --tail 5"

# ai-search CI — check + remote build on BWG
name: ai-search

on:
  push:
    branches: [main]
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'
  pull_request:
    paths:
      - 'ai-search/cli/**'
      - '.github/workflows/ai-search.yml'

defaults:
  run:
    working-directory: ai-search/cli

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ai-search/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('ai-search/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Deploy (BWG)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Setup SSH
        working-directory: /tmp
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BWG_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & restart on server
        working-directory: /tmp
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@${{ secrets.BWG_HOST }}"
          $SSH "cd /opt/ai-search/repo && \
            git fetch origin main && git reset --hard origin/main && \
            cd ai-search/cli && \
            source ~/.cargo/env && \
            cargo build --release 2>&1 | tail -5 && \
            cp target/release/ai-search /opt/ai-search/ai-search.new && \
            cp /opt/ai-search/ai-search /opt/ai-search/ai-search.old 2>/dev/null; \
            mv /opt/ai-search/ai-search.new /opt/ai-search/ai-search && \
            systemctl restart ai-search && \
            sleep 2 && systemctl --no-pager --full status ai-search | head -8"

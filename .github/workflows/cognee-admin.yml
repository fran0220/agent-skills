# cognee-admin CI — build, test, docker deploy to Oracle
name: cognee-admin

on:
  push:
    branches: [main]
    paths:
      - 'cognee-admin/cli/**'
      - '.github/workflows/cognee-admin.yml'
  pull_request:
    paths:
      - 'cognee-admin/cli/**'
      - '.github/workflows/cognee-admin.yml'

defaults:
  run:
    working-directory: cognee-admin/cli

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}/cognee-admin

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cognee_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COGNEE_ADMIN_DB: postgres://test:test@localhost:5432/cognee_admin_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cognee-admin/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cognee-admin/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Docker Build & Deploy (ARM64)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: cognee-admin/cli
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new opc@${{ secrets.ORACLE_HOST }}"
          $SSH "docker pull ${{ env.IMAGE }}:latest && \
            docker stop cognee-admin 2>/dev/null; docker rm cognee-admin 2>/dev/null; \
            docker run -d --name cognee-admin --restart unless-stopped \
              --network host \
              -e COGNEE_URL=http://localhost:8847 \
              -e COGNEE_ADMIN_DB=postgres://cognee:cognee_s3cret@localhost:5433/cognee_db \
              -e COGNEE_ADMIN_PORT=9847 \
              -e COGNEE_ADMIN_HOST=0.0.0.0 \
              -e RUST_LOG=info \
              ${{ env.IMAGE }}:latest \
              serve && \
            sleep 3 && docker logs cognee-admin --tail 5"

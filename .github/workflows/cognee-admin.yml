# cognee-admin CI — check + remote build on Oracle
name: cognee-admin

on:
  push:
    branches: [main]
    paths:
      - 'cognee-admin/cli/**'
      - '.github/workflows/cognee-admin.yml'
  pull_request:
    paths:
      - 'cognee-admin/cli/**'
      - '.github/workflows/cognee-admin.yml'

defaults:
  run:
    working-directory: cognee-admin/cli

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cognee_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COGNEE_ADMIN_DB: postgres://test:test@localhost:5432/cognee_admin_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            cognee-admin/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('cognee-admin/cli/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo check --release
      - run: cargo test
      - run: cargo clippy -- -D warnings 2>/dev/null || cargo clippy
      - run: cargo fmt -- --check

  deploy:
    name: Deploy (Oracle)
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build & restart on server
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new opc@${{ secrets.ORACLE_HOST }}"
          $SSH "cd /opt/cognee-admin/repo && \
            git fetch origin main && git reset --hard origin/main && \
            cd cognee-admin/cli && \
            source ~/.cargo/env && \
            cargo build --release 2>&1 | tail -5 && \
            sudo install -m 755 target/release/cognee-admin /usr/local/bin/cognee-admin && \
            sudo systemctl restart cognee-admin && \
            sleep 2 && sudo systemctl --no-pager --full status cognee-admin | head -8"
